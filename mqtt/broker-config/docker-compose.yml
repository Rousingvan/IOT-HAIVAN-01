version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: iot_ptit_mosquitto
    restart: always
    ports:
      - "18883:18883"    # MQTT Port tùy biến (Bảo mật & Tránh xung đột)
      - "9001:9001"      # WebSocket Port cho MQTT over WebSockets
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./passwords.txt:/mosquitto/config/passwords.txt
